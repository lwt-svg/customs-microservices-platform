[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# 明确告诉 setuptools：只有 app/ 是可导入的业务 Python 包。
# alembic/ 是迁移脚本目录，不应被当成第二个顶层 Python 包。
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project]
name = "link-booking-service"
version = "0.1.0"
description = "Local-only LINK booking learning microservice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncmy>=0.2,<1.0",
    "fastapi[standard]>=0.115,<1.0",
    # Nacos 2.5.3 的 HTTP OpenAPI 适配层使用它；这是运行时依赖，不是仅测试依赖。
    "httpx>=0.27,<1.0",
    # FastAPI 的 UploadFile multipart 解析需要显式安装，避免依赖传递关系变化后上传失效。
    "python-multipart>=0.0.12,<1.0",
    # 21.6 只读取文本型 PDF；扫描件 OCR 属于后续独立能力。
    "pypdf>=5.0,<7.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    # 测试只用它生成不含真实数据的最小 PDF，不属于服务运行时依赖。
    "reportlab>=4.2,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
