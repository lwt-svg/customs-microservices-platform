[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project]
name = "load-planning-service"
version = "0.1.0"
description = "Multi-constraint pallet and container load planning service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1,<1.0",
    "alembic>=1.14,<2.0",
    "asyncmy>=0.2,<1.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.2.15,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "reportlab>=4.2,<5.0",
    "ruff>=0.8,<1.0",
]
rpa = [
    # RPA Worker 与浏览器内核分开安装。依赖包由 pip 安装，Chromium 由
    # ``python -m playwright install chromium`` 安装，便于 Windows 申报机单独维护。
    "playwright>=1.55,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
