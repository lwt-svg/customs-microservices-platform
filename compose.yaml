name: customs-affairs-os-lab

# Everything in this file is local-only infrastructure for the learning project.
# It must never reference an enterprise address, cloud Nacos, FAT, or production data.
services:
  mysql:
    image: mysql:8.4
    container_name: customs-affairs-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env.local first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env.local first}
      MYSQL_USER: ${MYSQL_USER:?copy .env.example to .env.local first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env.local first}
    ports:
      - "3306:3306"
    volumes:
      # A named volume makes database restarts safe without writing data into Git.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    # This pinned image supports both Apple Silicon and x86_64.
    image: nacos/nacos-server:v2.5.3
    container_name: customs-affairs-lab-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?copy .env.example to .env.local first}
    ports:
      - "8848:8848"  # Nacos 控制台与 HTTP 主端口
      - "9848:9848"  # Java/Python 等客户端连接 Nacos 的 gRPC 端口
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
    name: customs-affairs-lab-mysql-data
