name: customs-affairs-os-lab

# Everything in this file is local-only infrastructure for the learning project.
# It must never reference an enterprise address, cloud Nacos, FAT, or production data.
services:
  mysql:
    image: mysql:8.4
    container_name: customs-affairs-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env.local first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env.local first}
      MYSQL_USER: ${MYSQL_USER:?copy .env.example to .env.local first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env.local first}
    ports:
      - "3306:3306"
    volumes:
      # A named volume makes database restarts safe without writing data into Git.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    # This pinned image supports both Apple Silicon and x86_64.
    image: nacos/nacos-server:v2.5.3
    container_name: customs-affairs-lab-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?copy .env.example to .env.local first}
    ports:
      - "8848:8848"  # Nacos 控制台与 HTTP 主端口
      - "9848:9848"  # Java/Python 等客户端连接 Nacos 的 gRPC 端口
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  carrier-simulator:
    build:
      context: ./services/link-carrier-simulator
    container_name: customs-affairs-lab-carrier-simulator
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 模拟承运人只使用自己的 schema，不能连接 LINK 或 Java 平台 schema。
      CARRIER_DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/link_carrier_simulator
      # 容器通过宿主机回调本地运行的 LINK 服务。
      CARRIER_CALLBACK_URL: http://host.docker.internal:8000/api/v1/carrier-callbacks/link
      CARRIER_CALLBACK_TOKEN: ${CARRIER_CALLBACK_TOKEN:?copy .env.example to .env.local first}
      CARRIER_CALLBACK_RETRY_WORKER_ENABLED: "true"
      CARRIER_CALLBACK_RETRY_POLL_SECONDS: ${CARRIER_CALLBACK_RETRY_POLL_SECONDS:-2}
      CARRIER_CALLBACK_LEASE_SECONDS: ${CARRIER_CALLBACK_LEASE_SECONDS:-15}
    extra_hosts:
      # macOS/Windows 原生支持此名称；该映射同时兼容本地 Linux Docker。
      - "host.docker.internal:host-gateway"
    ports:
      - "8100:8100"
    command:
      - sh
      - -c
      - python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8100
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/live')"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
    name: customs-affairs-lab-mysql-data
